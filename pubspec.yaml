name: ncc
description: "A robust Dart package for efficient network request handling, session management, real-time network state tracking, and seamless error handling for modern applications."
version: 1.0.0

repository: https://github.com/coolosos/ncc
issue_tracker: https://github.com/coolosos/ncc/issues
homepage: https://github.com/coolosos
topics:
  - http
  - network
  - protocols
  - session
  - rest-api

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  http: ^1.5.0
  meta: ^1.16.0

dev_dependencies:
  coolint: ^2.1.2
  test: ^1.26.3
